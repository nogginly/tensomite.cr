name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, crystal: "1.22.0" }
          - { os: macos-latest, crystal: "1.22.0" }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install OpenBLAS (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      # shard.lock is not committed, so the key follows shard.yml. The Crystal
      # version is part of the key because bin/ameba is compiled with it.
      - name: Cache shards and ameba
        uses: actions/cache@v5
        with:
          path: |
            lib
            shard.lock
            bin/ameba
          key: ${{ runner.os }}-crystal-${{ matrix.crystal }}-shards-${{ hashFiles('shard.yml') }}

      - name: Install shards
        run: shards check || shards install

      # GPT-2 small is fetched only once its reference fixtures are committed;
      # until then the M4 exit specs are pending and nothing is downloaded.
      - name: Cache GPT-2 small
        if: ${{ hashFiles('spec/fixtures/gpt2/expected.json') != '' }}
        uses: actions/cache@v5
        with:
          path: models/gpt2
          key: gpt2-small-openai-community-v1

      - name: Fetch GPT-2 small
        if: ${{ hashFiles('spec/fixtures/gpt2/expected.json') != '' }}
        run: scripts/fetch_gpt2.sh models/gpt2

      # Release mode keeps bounds and overflow checks, and runs GPT-2 small's
      # exit specs about five times faster than a debug build.
      - name: Run specs
        env:
          TENSOMITE_GPT2_DIR: models/gpt2
        run: crystal spec --release

      - name: Type-check benchmarks and examples
        run: |
          for f in bench/*.cr examples/*.cr; do
            case "$f" in *cuda*) flags=-Dcuda ;; *) flags= ;; esac
            crystal build --no-codegen $flags "$f"
          done
          for f in bench/gpt2.cr bench/gpt2_digest.cr; do crystal build --no-codegen -Dcuda "$f"; done

      # NVRTC needs no GPU, and the stand-in libcuda gives the CUDA device a GPU
      # in host memory that runs its kernels compiled as host C++: NVRTC compiles
      # every kernel, and the GPU specs compare the kernels with the CPU. Only the
      # specs that load PTX are pending.
      - name: Run the CUDA specs on the host stub (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          dir="$(scripts/cuda_stub/setup.sh /tmp/tensomite-cuda | tail -1)"
          LIBRARY_PATH="$dir" LD_LIBRARY_PATH="$dir" TENSOMITE_CUDA_KERNELS="$dir/libkernels.so" \
            crystal spec -Dcuda spec/cuda_spec.cr spec/gpu_spec.cr spec/device_spec.cr spec/gpt2_spec.cr

      # Metal code builds only for Apple Silicon; cross-compiling checks it without linking.
      - name: Cross-compile the Metal path (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: crystal build --cross-compile --target aarch64-apple-darwin spec/gpu_spec.cr spec/metal_spec.cr spec/gpt2_spec.cr -o /tmp/specs_darwin

      - name: Check formatting (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: crystal tool format --check src spec bench examples

      - name: Build ameba when not cached (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          if [ ! -x bin/ameba ]; then
            mkdir -p bin && cp lib/ameba/bin/ameba.cr bin && crystal build -o bin/ameba bin/ameba.cr
          fi

      - name: Run static code analysis (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: bin/ameba src/ spec/ bench/ examples/
